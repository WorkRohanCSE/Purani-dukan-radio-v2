<style>
:root {
  --cream: #F3E7D3;
  --maroon: #7A2E2E;
  --maroon-deep: #5C2020;
  --mustard: #D9A441;
  --teal: #1F5C57;
  --ink: #241C15;
  --card-radius: 28px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Poppins", system-ui, sans-serif;
  color: var(--ink);
  min-height: 100dvh;
  overflow-x: hidden;
  position: relative;
  background: var(--cream);
}
.bg-illustration { position: fixed; inset: 0; z-index: 0; }
.bg-illustration svg { width: 100%; height: 100%; }
.bg-tint {
  position: fixed; inset: 0; z-index: 1;
  background: linear-gradient(180deg, rgba(36,28,21,0.35), rgba(36,28,21,0.65) 70%, rgba(36,28,21,0.8));
}
#ytHost { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }

.start-overlay {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  border: none; cursor: pointer; background: transparent; padding: 24px;
  transition: opacity 0.5s ease;
}
.start-overlay.is-hidden { opacity: 0; pointer-events: none; }
.start-card {
  background: var(--cream); border: 3px solid var(--ink); border-radius: var(--card-radius);
  padding: 40px 32px; text-align: center; max-width: 340px; box-shadow: 10px 10px 0 var(--maroon-deep);
}
.start-badge { font-size: 13px; color: var(--teal); margin-bottom: 10px; }
.start-card h1 { font-family: "Baloo 2", sans-serif; font-size: 30px; margin: 0 0 10px; color: var(--maroon); }
.start-card p { margin: 0 0 22px; font-size: 15px; opacity: 0.85; }
.start-btn {
  display: inline-block; background: var(--mustard); border: 2px solid var(--ink);
  border-radius: 999px; padding: 12px 28px; font-weight: 600; font-size: 15px;
}

.app {
  position: relative; z-index: 2; min-height: 100dvh;
  display: flex; flex-direction: column;
  padding: 18px 18px calc(24px + env(safe-area-inset-bottom));
}
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 22px; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand-mark { font-size: 20px; color: var(--mustard); }
.brand-text { font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 17px; color: var(--cream); }
.icon-btn {
  background: rgba(243,231,211,0.12); border: 1.5px solid rgba(243,231,211,0.5);
  color: var(--cream); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
}

.player-stage {
  flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 26px;
  max-width: 420px; width: 100%; margin: 0 auto;
}

.cassette {
  background: var(--maroon); border: 3px solid var(--ink); border-radius: var(--card-radius);
  padding: 26px 22px 22px; box-shadow: 10px 10px 0 var(--maroon-deep);
}
.cassette-window {
  background: var(--ink); border-radius: 16px; padding: 22px 18px;
  display: flex; align-items: center; justify-content: space-between; position: relative; overflow: hidden;
}
.reel {
  width: 62px; height: 62px; border-radius: 50%;
  background: repeating-conic-gradient(var(--mustard) 0deg 8deg, transparent 8deg 45deg);
  display: flex; align-items: center; justify-content: center; transition: transform 0.2s linear;
}
.reel-hub { width: 20px; height: 20px; border-radius: 50%; background: var(--cream); border: 3px solid var(--ink); }
.tape-arc { flex: 1; height: 2px; background: var(--mustard); margin: 0 12px; opacity: 0.6; border-radius: 2px; }
.cassette.is-spinning .reel { animation: spin 2.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .cassette.is-spinning .reel { animation: none; } }

.cassette-label { text-align: center; padding-top: 20px; }
.now-playing-eyebrow { margin: 0 0 4px; font-size: 12px; color: var(--mustard); font-weight: 500; }
.now-playing-title {
  margin: 0; font-family: "Baloo 2", sans-serif; font-size: 22px; color: var(--cream); font-weight: 700;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.now-playing-sub { margin: 4px 0 0; font-size: 13px; color: var(--cream); opacity: 0.75; }
.cassette-screws { display: flex; justify-content: space-between; padding: 0 6px; margin-top: 16px; }
.cassette-screws span { width: 8px; height: 8px; border-radius: 50%; background: var(--cream); opacity: 0.5; display: block; }

.progress-row { display: flex; align-items: center; gap: 10px; }
.time { font-size: 12px; color: var(--cream); min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
.seek { -webkit-appearance: none; appearance: none; flex: 1; height: 6px; border-radius: 999px; background: rgba(243,231,211,0.3); outline: none; }
.seek::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--mustard); border: 2px solid var(--ink); cursor: pointer; }
.seek::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--mustard); border: 2px solid var(--ink); cursor: pointer; }

.controls-row { display: flex; align-items: center; justify-content: center; gap: 22px; }
.ctrl-btn {
  background: var(--cream); border: 2px solid var(--ink); color: var(--ink);
  width: 52px; height: 52px; border-radius: 50%; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.ctrl-btn--main { width: 68px; height: 68px; font-size: 22px; background: var(--mustard); }

.volume-row { display: flex; align-items: center; gap: 10px; color: var(--cream); font-size: 15px; padding: 0 4px; }
.seek--volume { height: 5px; }

.drawer {
  position: fixed; right: 0; top: 0; bottom: 0; width: min(340px, 86vw);
  background: var(--cream); border-left: 3px solid var(--ink); z-index: 20;
  transform: translateX(100%); transition: transform 0.3s ease;
  display: flex; flex-direction: column; padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
}
.drawer.is-open { transform: translateX(0); }
.drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.drawer-head h2 { font-family: "Baloo 2", sans-serif; font-size: 18px; margin: 0; color: var(--maroon); }
.drawer .icon-btn { background: transparent; border-color: var(--ink); color: var(--ink); }

.track-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
.track-item { display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-bottom: 1px solid rgba(36,28,21,0.12); cursor: pointer; }
.track-item-num { font-size: 13px; color: var(--teal); font-weight: 600; width: 20px; }
.track-item-meta { display: flex; flex-direction: column; overflow: hidden; }
.track-item-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-item-artist { font-size: 12px; opacity: 0.65; }
.track-item.is-active .track-item-title { color: var(--maroon); font-weight: 700; }

.drawer-note { font-size: 11.5px; opacity: 0.65; margin: 14px 0 0; line-height: 1.5; }
.drawer-note code { background: rgba(36,28,21,0.08); padding: 1px 5px; border-radius: 4px; }

@media (min-width: 640px) { .app { padding-top: 32px; } }
</style>

<script>
(function () {
  "use strict";

  let player = null;
  let currentIndex = 0;
  let isPlaying = false;
  let userSeeking = false;
  let pollTimer = null;

  const els = {
    startOverlay: document.getElementById("startOverlay"),
    app: document.getElementById("app"),
    playBtn: document.getElementById("playBtn"),
    prevBtn: document.getElementById("prevBtn"),
    nextBtn: document.getElementById("nextBtn"),
    seek: document.getElementById("seek"),
    volume: document.getElementById("volume"),
    timeCurrent: document.getElementById("timeCurrent"),
    timeTotal: document.getElementById("timeTotal"),
    trackTitle: document.getElementById("trackTitle"),
    trackArtist: document.getElementById("trackArtist"),
    trackList: document.getElementById("trackList"),
    listToggle: document.getElementById("listToggle"),
    drawer: document.getElementById("trackDrawer"),
    drawerClose: document.getElementById("drawerClose"),
    cassette: document.getElementById("cassette"),
  };

  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  }

  function buildTrackList() {
    els.trackList.innerHTML = "";
    PLAYLIST.forEach((t, i) => {
      const li = document.createElement("li");
      li.className = "track-item";
      li.dataset.index = i;
      li.innerHTML = `<span class="track-item-num">${i + 1}</span>
        <span class="track-item-meta">
          <span class="track-item-title">${t.title}</span>
          <span class="track-item-artist">${t.artist || ""}</span>
        </span>`;
      li.addEventListener("click", () => loadTrack(i, true));
      els.trackList.appendChild(li);
    });
  }

  function highlightActiveTrack() {
    [...els.trackList.children].forEach((li) => {
      li.classList.toggle("is-active", Number(li.dataset.index) === currentIndex);
    });
  }

  function updateLabel() {
    const t = PLAYLIST[currentIndex];
    els.trackTitle.textContent = t.title;
    els.trackArtist.textContent = t.artist || "";
    highlightActiveTrack();
  }

  function loadTrack(index, autoplay) {
    if (!player || !PLAYLIST.length) return;
    currentIndex = (index + PLAYLIST.length) % PLAYLIST.length;
    updateLabel();
    if (autoplay) {
      player.loadVideoById(PLAYLIST[currentIndex].id);
    } else {
      player.cueVideoById(PLAYLIST[currentIndex].id);
    }
  }

  function setPlayingUI(playing) {
    isPlaying = playing;
    els.playBtn.textContent = playing ? "⏸" : "▶";
    els.cassette.classList.toggle("is-spinning", playing);
  }

  function togglePlay() {
    if (!player) return;
    isPlaying ? player.pauseVideo() : player.playVideo();
  }

  els.playBtn.addEventListener("click", togglePlay);
  els.prevBtn.addEventListener("click", () => loadTrack(currentIndex - 1, true));
  els.nextBtn.addEventListener("click", () => loadTrack(currentIndex + 1, true));

  els.seek.addEventListener("input", () => { userSeeking = true; });
  els.seek.addEventListener("change", () => {
    if (player && player.getDuration) {
      const dur = player.getDuration();
      if (dur) player.seekTo((els.seek.value / 100) * dur, true);
    }
    userSeeking = false;
  });

  els.volume.addEventListener("input", () => {
    if (player) player.setVolume(Number(els.volume.value));
  });

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(() => {
      if (!player || userSeeking) return;
      const dur = player.getDuration ? player.getDuration() : 0;
      const cur = player.getCurrentTime ? player.getCurrentTime() : 0;
      els.timeCurrent.textContent = formatTime(cur);
      els.timeTotal.textContent = formatTime(dur);
      if (dur) els.seek.value = (cur / dur) * 100;
    }, 500);
  }
  function stopPolling() { if (pollTimer) clearInterval(pollTimer); }

  function openDrawer() {
    els.drawer.classList.add("is-open");
    els.drawer.setAttribute("aria-hidden", "false");
    els.listToggle.setAttribute("aria-expanded", "true");
  }
  function closeDrawer() {
    els.drawer.classList.remove("is-open");
    els.drawer.setAttribute("aria-hidden", "true");
    els.listToggle.setAttribute("aria-expanded", "false");
  }
  els.listToggle.addEventListener("click", () => {
    els.drawer.classList.contains("is-open") ? closeDrawer() : openDrawer();
  });
  els.drawerClose.addEventListener("click", closeDrawer);

  // YouTube IFrame API hook
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("ytHost", {
      height: "1",
      width: "1",
      videoId: PLAYLIST[0] ? PLAYLIST[0].id : "",
      playerVars: { autoplay: 0, controls: 0, playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          buildTrackList();
          updateLabel();
          player.setVolume(Number(els.volume.value));
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING) { setPlayingUI(true); startPolling(); }
          else if (e.data === YT.PlayerState.PAUSED) { setPlayingUI(false); stopPolling(); }
          else if (e.data === YT.PlayerState.ENDED) { loadTrack(currentIndex + 1, true); }
        }
      }
    });
  };

  els.startOverlay.addEventListener("click", () => {
    els.startOverlay.classList.add("is-hidden");
    els.app.setAttribute("aria-hidden", "false");
    if (player) player.playVideo();
    setTimeout(() => els.startOverlay.remove(), 500);
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
})();
</script>
</body>
</html>
